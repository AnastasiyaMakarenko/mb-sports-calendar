<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь спортивных событий 2026–2027</title>
  <meta name="description" content="Все главные спортивные и киберспортивные события с сентября 2026 по декабрь 2027.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#161616">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2026-10-02">
</head>
<body>
  <div class="page">
    <a class="bonus" href="#" data-bonus>
      <span class="bonus__big">Бонус</span>
      <span class="bonus__small">на первый<br>депозит до</span>
      <span class="bonus__sum">15 000 RUB</span>
      <span class="bonus__btn">Забрать бонус</span>
    </a>

    <main class="sheet">
      <header class="hero">
        <div class="hero__text">
          <h1 class="hero__title">Календарь<br>спортивных<br>событий</h1>
          <p class="hero__lead">Не ломай голову — выбирай, на что поставить в&nbsp;2026–2027&nbsp;году</p>
        </div>
        <div class="hero__art" aria-hidden="true">
          <span class="ball ball--1"></span>
          <span class="ball ball--2"></span>
          <span class="ball ball--3"></span>
          <span class="ball ball--4"></span>
          <div class="cal-block">
            <div class="cal-block__rings"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="cal-block__brand">МБ</div>
            <div class="cal-block__num">26<small>/27</small></div>
          </div>
        </div>
      </header>

      <!-- Все фильтры спрятаны под одну кнопку -->
      <section class="filters" aria-label="Фильтры">
        <button class="fbtn" id="filtersBtn" type="button" aria-expanded="false" aria-controls="fpanel">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 5h18v2.2l-7 6.6V21l-4-2.2v-5l-7-6.6V5Z"/></svg>
          Фильтры<span class="fbtn__n" id="filtersCount" hidden></span>
        </button>
        <button class="reset" id="resetBtn" type="button" hidden>Сбросить</button>

        <div class="fpanel" id="fpanel" hidden>
          <div class="fpanel__head">
            <b>Фильтры</b>
            <button class="fpanel__close" id="filtersClose" type="button" aria-label="Закрыть">×</button>
          </div>

          <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
            <input type="search" id="q" placeholder="Найти турнир или команду">
          </label>

          <div class="fgroup">
            <span class="fgroup__t">Раздел</span>
            <div class="seg" role="tablist">
              <button class="seg__btn is-active" data-cat="all">Все</button>
              <button class="seg__btn" data-cat="sport">Спорт</button>
              <button class="seg__btn" data-cat="esport">Киберспорт</button>
            </div>
          </div>

          <div class="fgroup">
            <span class="fgroup__t">Виды спорта</span>
            <div class="chips" id="sportChips"></div>
          </div>

          <div class="fgroup">
            <span class="fgroup__t">Популярность</span>
            <div class="stars-filter" role="group" aria-label="Популярность события">
              <button class="star-btn is-active" data-min="0">Любая</button>
              <button class="star-btn" data-min="3">★ 3+</button>
              <button class="star-btn" data-min="4">★ 4+</button>
              <button class="star-btn" data-min="5">★ 5</button>
            </div>
          </div>

          <label class="toggle"><input type="checkbox" id="onlyConfirmed"><span></span>Только точные даты</label>

          <div class="fpanel__foot">
            <button class="btn btn--ghost" id="resetBtn2" type="button">Сбросить всё</button>
            <button class="btn btn--dark" id="filtersApply" type="button">Показать</button>
          </div>
        </div>
      </section>

      <!-- Месяцы и турниры -->
      <section class="block" id="calendar">
        <nav class="months" id="months" aria-label="Месяцы"></nav>
        <h2 class="h2" id="listTitle"></h2>
        <div class="cards" id="cards"></div>
        <p class="empty" id="cardsEmpty" hidden>Событий не найдено — попробуйте сбросить фильтры.</p>
        <button class="more-btn" id="moreCards" type="button" hidden></button>
      </section>
    </main>
  </div>

  <script src="js/data.js?v=2026-10-02"></script>
  <script src="js/app.js?v=2026-10-02"></script>
</body>
</html>
