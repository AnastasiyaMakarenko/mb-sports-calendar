<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка загрузчика</title>
<style>body{margin:0;font-family:Georgia,serif;color:#333;text-align:center}.host{padding:16px;background:#eee}</style>
</head><body>
<div class="host">Страница сайта до блока</div>
<!-- Календарь спортивных событий. Вставить один раз; обновления приходят сами. -->
<div id="mbc">Загружаем календарь…</div>
<script>
(function () {
  var BASE = 'http://localhost:8765/embed/';
  var box = document.getElementById('mbc');
  function get(file) {
    return fetch(BASE + file + '?t=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(file + ': ' + r.status);
      return r.text();
    });
  }
  Promise.all([get('calendar.css'), get('calendar.html'), get('calendar.js')])
    .then(function (parts) {
      var style = document.createElement('style');
      style.textContent = parts[0];
      document.head.appendChild(style);
      box.innerHTML = parts[1];
      var script = document.createElement('script');
      script.textContent = parts[2];
      document.body.appendChild(script);
    })
    .catch(function (e) {
      box.textContent = 'Не удалось загрузить календарь (' + e.message + ')';
    });
})();
</script>

<div class="host">Страница сайта после блока</div>
</body></html>
