  <style>
:root {
  --bg: #161616;
  --ink: #111;
  --muted: #777;
  --line: #ececec;
  --soft: #f4f4f4;
  --yellow: #ffd21f;
  --yellow-2: #ffb800;
  --gold-1: #fff1a8;
  --gold-2: #e6b422;
  --gold-3: #8a6212;
  --r: 20px;
  --font: 'Onest', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; color: inherit; }
a { color: inherit; }
.page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 32px; }

/* ---------- Баннеры ---------- */
.bonus { display: block; margin-bottom: 14px; border-radius: var(--r); overflow: hidden; line-height: 0; }
.bonus img { display: block; width: 100%; height: auto; }

.sheet { background: #fff; border-radius: var(--r); overflow: hidden; padding-bottom: 28px; }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 300px; }
.hero__text { padding: 44px 0 28px 30px; align-self: center; }
.hero__title {
  margin: 0; font-weight: 900; text-transform: uppercase;
  font-size: clamp(34px, 5.4vw, 56px); line-height: .96; letter-spacing: -2px;
}
.hero__lead { margin: 18px 0 0; font-size: 17px; line-height: 1.35; max-width: 330px; color: #222; }
.hero__art { position: relative; overflow: hidden; background: #f4f4f4; }
.hero__art img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* ---------- Кнопка фильтров ---------- */
.filters { position: relative; padding: 20px 30px 0; display: flex; align-items: center; gap: 10px; }
.fbtn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff;
  border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600;
}
.fbtn:hover { border-color: #bbb; }
.fbtn.is-on { background: #111; border-color: #111; color: #fff; }
.fbtn__n { background: var(--yellow); color: #111; border-radius: 20px; min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; padding: 0 6px; }
.reset { border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; }

.fpanel {
  position: absolute; z-index: 30; top: calc(100% + 8px); left: 30px; width: min(460px, calc(100% - 60px));
  background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,.18);
}
.fpanel[hidden] { display: none; }
.fpanel__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; }
.fpanel__close { border: 0; background: var(--soft); width: 30px; height: 30px; border-radius: 50%; font-size: 20px; line-height: 1; }
.fgroup { margin-top: 14px; }
.fgroup__t { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.fpanel__foot { display: flex; gap: 8px; margin-top: 16px; }
.fpanel__foot .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.chip.is-active { background: #111; border-color: #111; color: #fff; }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; padding: 12px 18px; font-weight: 700; border: 0; font-size: 14px; }
.btn--dark { background: #111; color: var(--yellow); }
.btn--ghost { background: var(--soft); }

/* ---------- Месяцы ---------- */
.block { padding: 20px 30px 0; }
.months { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; scrollbar-width: none; }
.months::-webkit-scrollbar { display: none; }
.mon {
  flex: none; border: 0; background: transparent; border-radius: 10px; padding: 8px 12px;
  font-size: 15px; font-weight: 600; color: #555; display: flex; align-items: baseline; gap: 5px; white-space: nowrap;
}
.mon small { font-size: 11px; color: var(--muted); font-weight: 600; }
.mon:hover { background: var(--soft); }
.mon.is-past { color: #b5b5b5; }
.mon.is-active { background: #111; color: #fff; font-weight: 700; }
.mon.is-active small { color: var(--yellow); }

.h2 { margin: 0 0 14px; font-weight: 900; text-transform: uppercase; font-size: 26px; letter-spacing: -1px; }

/* ---------- Карточки ---------- */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card {
  position: relative; overflow: hidden; min-height: 140px; border-radius: 16px; padding: 14px; color: #fff;
  display: flex; flex-direction: column; background: var(--g, #333); text-decoration: none;
  transition: transform .15s, box-shadow .15s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(0,0,0,.22); }
.card__ico { position: absolute; right: 12px; top: 10px; width: 48px; height: 48px; color: #fff; opacity: .24; pointer-events: none; }
.card__wm { position: absolute; right: -10px; bottom: -22px; font-size: 110px; font-weight: 900; line-height: 1; color: rgba(255,255,255,.13); letter-spacing: -6px; pointer-events: none; white-space: nowrap; text-transform: uppercase; }
.card__g { position: relative; font-size: 11px; opacity: .85; }
.card__t { position: relative; margin-top: 4px; font-size: 20px; line-height: 1.05; font-weight: 800; text-transform: uppercase; }
/* место под иконку сверху и под метку снизу, чтобы они не наезжали на текст */
.card__g, .card__t { padding-right: 56px; }
.card.has-badge .card__link { padding-right: 92px; }
.card__link { position: relative; margin-top: auto; padding-top: 14px; font-size: 11px; text-decoration: underline; align-self: flex-start; }
.badge {
  position: absolute; bottom: 12px; right: 12px; z-index: 2; max-width: 84px;
  background: var(--yellow); color: #111; font-weight: 800; font-size: 9px; line-height: 1.1;
  text-transform: uppercase; padding: 5px 7px; border-radius: 8px; text-align: center;
}
.badge--top { max-width: none; font-size: 10px; padding: 5px 10px; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.more-btn { display: block; margin: 16px auto 0; border: 0; background: var(--soft); border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 14px; }
.more-btn:hover { background: #fff5c7; }

/* ---------- Адаптив ---------- */
@media (max-width: 900px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; min-height: 0; }
  .hero__text { padding: 26px 20px 8px; }
  .hero__art { height: 210px; }
  .filters { padding: 16px 16px 0; }
  .block { padding: 18px 16px 0; }
  .fpanel { left: 16px; width: calc(100% - 32px); }
}
@media (max-width: 480px) {
  .cards { grid-template-columns: 1fr; }
  .card { min-height: 120px; }
  .h2 { font-size: 22px; }
}

  </style>
</head>

    if (act) nav.scrollLeft = act.offsetLeft - nav.clientWidth / 2 + act.clientWidth / 2;
  }

  /* ---------- Карточки месяца ---------- */
  function badge(e) {
    if (e.rank && e.rank <= 10) return '<span class="badge badge--top">Топ</span>';
    if (e.rank) return '<span class="badge">стоит посмотреть</span>';
    return '';
  }
  function cardHtml(e) {
    // ссылка на турнир в линии: берём из поля url события, иначе общий LINE_URL
    var href = e.url || LINE_URL;
    return '<a class="card' + (e.rank ? ' has-badge' : '') + '" href="' + esc(href) + '" data-line style="--g:' + grad(e.c) + '" title="' + esc(e.t) + ' · ' + esc(e.d) + '">' +
      '<span class="card__wm">' + esc(wm(e)) + '</span>' + icon(e) +
      badge(e) +
      '<span class="card__g">' + esc(e.g) + '</span>' +
      '<span class="card__t">' + esc(e.t) + '</span>' +
      '<span class="card__link">Перейти в линию</span></a>';
  }
  function renderList() {
    var b = monthBounds(state.month);
    var m = +state.month.slice(5, 7), y = state.month.slice(0, 4);
    var list = EVENTS.filter(function (e) { return pass(e) && overlaps(e, b[0], b[1]); }).sort(byPopularity);
    $('#listTitle').textContent = MONTHS_NOM[m - 1] + ' ' + y;
    $('#cardsEmpty').hidden = list.length > 0;
    $('#cards').innerHTML = list.slice(0, state.shown).map(cardHtml).join('');
    var rest = list.length - state.shown;
    var more = $('#moreCards');
    more.hidden = rest <= 0;
    more.textContent = 'Показать ещё ' + Math.min(rest, CARDS_STEP) + ' из ' + rest;
  }

  function renderAll() { state.shown = CARDS_STEP; renderChips(); renderMonths(); renderList(); }

  function resetFilters() { state.sports = {}; renderAll(); }

  /* ---------- Обработчики ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;

    // клик по карточке и по кнопке бонуса ведёт на внешние ссылки
    var card = t.closest('[data-line]');
    if (card && card.getAttribute('href') === '#') { ev.preventDefault(); return; }
    if (t.closest('[data-bonus]') && BONUS_URL === '#') { ev.preventDefault(); return; }

    if (t.closest('#filtersBtn')) { openFilters($('#fpanel').hidden); return; }
    if (t.closest('#filtersClose') || t.closest('#filtersApply')) { openFilters(false); return; }
    if (t.closest('#resetBtn') || t.closest('#resetBtn2')) { resetFilters(); return; }
    if (!t.closest('.filters') && !$('#fpanel').hidden) openFilters(false);

    if ((el = t.closest('[data-sport]'))) {
      var k = el.getAttribute('data-sport');
      if (state.sports[k]) delete state.sports[k]; else state.sports[k] = 1;
      return renderAll();
    }
    if ((el = t.closest('[data-month]'))) {
      state.month = el.getAttribute('data-month'); state.shown = CARDS_STEP;
      renderMonths(); renderList(); return;
    }
    if (t.closest('#moreCards')) { state.shown += CARDS_STEP; renderList(); return; }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#fpanel').hidden) openFilters(false);
  });

  $('[data-bonus]').setAttribute('href', BONUS_URL);

  /* ---------- Старт ---------- */
  state.month = START_MONTH;
  renderAll();
})();

</script>
</body>
</html>
